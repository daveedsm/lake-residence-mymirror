# Main Lake Residence website gateway, deployed 2026-10-23.
# Uses the latest public Sites publication (version 92 at deployment).
# MyMirror remains on the separate /myapp route.
# Rollback service image: agam-life-site:latest with pull_policy: never.
services:
  agam-life:
    image: nginx:stable-alpine
    expose:
      - "80"
    configs:
      - source: lake-residence-proxy
        target: /etc/nginx/conf.d/default.conf
configs:
  lake-residence-proxy:
    content: |
      server {
        listen 80;
        server_name _;
        location / {
          proxy_pass https://agam-life.daveedsm.chatgpt.site;
          proxy_ssl_server_name on;
          proxy_ssl_name agam-life.daveedsm.chatgpt.site;
          proxy_set_header Host agam-life.daveedsm.chatgpt.site;
          proxy_set_header X-Forwarded-Proto https;
          proxy_redirect https://agam-life.daveedsm.chatgpt.site/ /;
        }
      }
