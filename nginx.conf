server {
 listen 80;
 server_name _;
 location = /myapp { return 302 /myapp/; }
 location /myapp/ { root /usr/share/nginx/html; index index.html; try_files $uri $uri/ /myapp/index.html; }
 location / { proxy_pass https://agam-life.daveedsm.chatgpt.site; proxy_ssl_server_name on; proxy_ssl_name agam-life.daveedsm.chatgpt.site; proxy_set_header Host agam-life.daveedsm.chatgpt.site; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}
