server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location = / { try_files /index.html =404; add_header Cache-Control "no-store"; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /crm/ai { try_files /index.html =404; add_header Cache-Control "no-store"; }
    location = /crm/ai/ { try_files /index.html =404; add_header Cache-Control "no-store"; }
    location = /crm/ai/lake-residence-monogram.png { alias /usr/share/nginx/html/lake-residence-monogram.png; }
    location / { return 404; }
}
