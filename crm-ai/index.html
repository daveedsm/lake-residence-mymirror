function drawAssistantMessages(){const area=$('#assistant-history');if(!area)return;area.innerHTML=assistantHistory.map(m=>`<div class="assistant-message ${m.role}"><small>${m.role==='user'?'YOU':'LAKE ASSISTANT � DEMO'}</small><p dir="auto">${esc(m.text)}</p></div>`).join('');area.scrollTop=area.scrollHeight}
function openAssistant(){if($('#assistant-panel'))return;const panel=document.createElement('section');panel.id='assistant-panel';panel.className='assistant-panel';panel.setAttribute('aria-label','Lake Residence Assistant');panel.innerHTML=`<div class="assistant-head"><div><b>Lake Assistant</b><small>Command preview � AI not connected</small></div><button class="icon-button" id="assistant-close" aria-label="Close assistant">?</button></div><div class="assistant-suggestions"><button data-assistant-example="Show occupancy">Occupancy</button><button data-assistant-example="Show open tasks">Open tasks</button><button data-assistant-example="Open original CRM">Original CRM</button></div><div id="assistant-history" class="assistant-history" aria-live="polite"></div><form id="assistant-form"><label class="sr-only" for="assistant-input">Message or command</label><input id="assistant-input" placeholder="Ask or command in English or Hebrew." autocomplete="off"><button class="mic-control" type="button" id="assistant-mic" aria-label="Dictate a command">${micIcon()}</button><button class="assistant-send" aria-label="Run command">?</button></form><div class="assistant-voice-status"><label>Voice <select id="voice-language" aria-label="Voice language"><option value="he-IL">�����</option><option value="en-US">English</option></select></label><span id="voice-status">Click the microphone to dictate.</span></div>`;document.body.append(panel);drawAssistantMessages();$('#assistant-input').focus()}
function micIcon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg>'}
function closeAssistant(){if(recognition&&listening)recognition.stop();$('#assistant-panel')?.remove()}
function runAssistantCommand(input){const value=input.trim();if(!value)return;openAssistant();assistantMessage('user',value);const command=parseCommand(value);let result='';switch(command.type){
 case 'navigate':navigate(command.page);result='Opened '+(nav.find(n=>n[0]===command.page)?.[1]||command.page)+'.';break;
 case 'summary':{const m=metrics(data);result=`Demo overview: ${m.total} apartments, ${m.occupied} occupied, ${m.available} available, ${m.occupancy}% occupancy. Today: ${m.arrivals} arrivals, ${m.departures} departures, ${m.openTasks} open tasks. These are sample metrics, not the published CRM records.`;break}
 case 'new_task':newTask();if(command.title)$('#task-create [name="title"]').value=command.title;result='Prepared a new demo staff task. Review the fields and save to create it.';break;
 case 'new_reservation':newBooking();result='Prepared a demo reservation form. Review apartment availability and dates before creating it.';break;
 case 'app':navigate('app-'+command.app);result='Opened '+(apps.find(a=>a.id===command.app)?.name||command.app)+'. The original app may require sign-in. Actions inside it are not controlled by this command preview.';break;
 case 'integration':showApp(command.app);result='Guesty is planned, not connected. No request was sent to Guesty.';break;
 case 'apartment':navigate('published-crm');result='Opened the published CRM workspace. Use its apartment search for '+command.number+'. Direct selection through the original API has not been connected yet.';break;
 case 'reception':navigate('published-crm');result='Use Reception Screen to open the original published apartment view in a separate window. Move that window to the reception monitor.';break;
 case 'help':result='Try: "Show occupancy", "Show open tasks", "Open original CRM", "Open My Stay", "Create task: Clean apartment 101", or "New reservation". Hebrew commands are also supported. This preview uses a limited local command list; a language model is not connected yet.';break;
 default:result='I cannot execute that command in this preview. Try Show open tasks, Show occupancy, Open My Stay or New reservation. No action was taken.';
}assistantMessage('assistant',result);if($('#assistant-input'))$('#assistant-input').value=''}
function dictateCommand(){openAssistant();const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech){$('#voice-status').textContent='Voice is unavailable in this browser. Type your command instead.';return}if(listening){recognition.stop();return}recognition=new Speech();recognition.lang=$('#voice-language').value;recognition.continuous=false;recognition.interimResults=true;recognition.onstart=()=>{listening=true;$('#assistant-mic')?.classList.add('listening');$('#voice-status').textContent='Listening through your browser's speech service.'};recognition.onresult=event=>{let text='';for(let i=0;i<event.results.length;i++)text+=event.results[i][0].transcript;$('#assistant-input').value=text;if(event.results[event.results.length-1].isFinal){$('#voice-status').textContent='Transcript ready. Press Enter to run the command.'}};recognition.onerror=event=>{$('#voice-status').textContent=event.error==='not-allowed'?'Microphone access was not granted. You can type a command.':'Voice recognition did not finish. Try again or type a command.'};recognition.onend=()=>{listening=false;$('#assistant-mic')?.classList.remove('listening')};try{recognition.start()}catch{$('#voice-status').textContent='Unable to start voice recognition. Type a command instead.'}}
document.addEventListener('click',event=>{if(event.target.closest('#assistant-open,#assistant-launcher'))openAssistant();if(event.target.closest('#assistant-close'))closeAssistant();if(event.target.closest('#command-mic,#assistant-mic'))dictateCommand();const suggestion=event.target.closest('[data-assistant-example]');if(suggestion)runAssistantCommand(suggestion.dataset.assistantExample)});
document.addEventListener('submit',event=>{if(event.target.id==='assistant-form'){event.preventDefault();runAssistantCommand($('#assistant-input').value)}});
$('#global-search').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();runAssistantCommand(event.target.value)}});
document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key==='k'){event.preventDefault();openAssistant()}if(event.key==='Escape')closeAssistant()});
const launcher=document.createElement('button');launcher.id='assistant-launcher';launcher.className='assistant-launcher';launcher.innerHTML=icon('message')+' Ask Lake Assistant';document.body.append(launcher);

function setNavigation(open){document.documentElement.classList.toggle('nav-collapsed',!open);$('.sidebar').classList.toggle('open',open);$('#menu-toggle').setAttribute('aria-expanded',String(open));$('#menu-toggle').setAttribute('aria-label',open?'Close navigation':'Open navigation');try{localStorage.setItem('lake-crm-nav-open',String(open))}catch{}}
let navigationInitiallyOpen=false;try{navigationInitiallyOpen=localStorage.getItem('lake-crm-nav-open')==='true'}catch{}setNavigation(navigationInitiallyOpen);document.addEventListener('keydown',event=>{if(event.key==='Escape')setNavigation(false)});document.addEventListener('click',event=>{if(!document.documentElement.classList.contains('nav-collapsed')&&!event.target.closest('.sidebar,#menu-toggle'))setNavigation(false)});
</script></body>
</html>
