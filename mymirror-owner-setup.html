<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>MyMirror · Owner setup</title>
<style>body{background:#edf2f6;color:#162d42;font:16px system-ui;margin:0;padding:32px 20px}main{max-width:440px;margin:8vh auto;background:white;border-radius:20px;padding:28px}h1{font-size:26px}label{display:block;margin:20px 0}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #b8c5ce;border-radius:9px;font:inherit}button{border:0;border-radius:10px;background:#173b59;color:white;padding:13px 20px;font:inherit;width:100%}p{line-height:1.6}#result{min-height:24px}</style>
<main><h1>MyMirror Admin</h1><p>Create your owner password. Only your owner account can change service destinations and API settings.</p><p>Sign in with your email or <strong>admin</strong>.</p><form id="setup"><label>Your email<input name="email" type="email" required autocomplete="username"></label><label>Your new password<input name="password" type="password" required minlength="14" maxlength="200" autocomplete="new-password"></label><label>Confirm password<input name="confirmPassword" type="password" required minlength="14" maxlength="200" autocomplete="new-password"></label><button>Create owner account</button></form><p id="result" role="status"></p></main>
<script>const token=location.hash.slice(1),form=document.getElementById('setup'),out=document.getElementById('result');history.replaceState(null,'',location.pathname);if(!token){form.hidden=true;out.textContent='Open your private, temporary setup link to continue.';}form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;out.textContent='Saving…';try{const data=Object.fromEntries(new FormData(form));const r=await fetch('/myapp/api/admin/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,token})});const d=await r.json();if(!r.ok)throw Error(d.error||'Setup failed');form.reset();form.hidden=true;out.textContent='Owner account created. ';const a=document.createElement('a');a.href='/myapp/admin';a.textContent='Open MyMirror Admin and sign in';out.append(a);}catch(e){out.textContent=e.message;button.disabled=false;}};</script></html>
