function render(){nav();const c=document.getElementById('content');c.className='view';let html='';if(state.page==='home')html=head('Welcome home.','Everything you need. Beautifully in reach.')+`<div class="layout"><div><div class="hero"><div class="hero-head"><strong>${safe(unitName(u()))}</strong><button class="rename-inline" id="rename-home" aria-label="Rename my apartment">✎</button><div class="property-number">Apartment number: ${safe(u().label||'Awaiting assignment')}</div></div>${scene}<img class="residence-photo" src="${safe(u().photo||u().stockPhoto||defaultPhoto)}" alt="${u().photo?'Apartment photo':'Apartment interior image from the existing Lake Residence website'}" onerror="this.hidden=true"><div class="hero-shade"></div><div class="hero-foot"><span><i class="dot"></i>${u().photo?'YOUR APARTMENT':'LAKE RESIDENCE'}</span><span>SEA OF GALILEE · TIBERIAS</span></div></div>${quickbar()}<div class="controls">${services.map(tile).join('')}<button class="tile" data-page="apartment"><div class="sculpt">${icon('apartment')}</div><b>My apartment</b><small>Income, bookings & photos</small><span class="chev">↗</span></button></div>${homeFinances()}</div><div class="side-column"><div class="card keycard"><div class="eyebrow" style="color:#a3bed4">A smarter way home</div><div class="sculpt">${icon('key')}</div><h2>Your phone.<br>Your key.</h2><p>Personal access to your residence, all in one place.</p><button class="text-button" data-service="key">Access details <span class="arrow">↗</span></button></div><div><div class="subhead"><h2>Make yourself at home</h2><button class="text-button" data-page="services">View all ↗</button></div>${services.slice(4).concat([['apartment','My apartment','Bookings, finances & photos']]).map(s=>`<button class="service-row" ${s[0]==='apartment'?'data-page="apartment"':`data-service="${s[0]}"`}><span class="sculpt">${icon(s[0])}</span><span><b>${s[1]}</b><small>${s[2]}</small></span><span class="arrow">›</span></button>`).join('')}<div class="note">${icon('info')}<span>Access controls become available when your building systems are connected.</span></div></div><div class="welcome"><b>Your next stay.</b><p>Bookings, arrivals and apartment availability, together in one place.</p><button class="text-button" style="margin-top:14px" data-calendar>View schedule ↗</button></div></div></div>`;
if(state.page==='services')html=head('At your service.','The everyday, taken care of.')+`<div class="grid3">${services.map(tile).join('')}</div>`;
if(state.page==='apartment')html=apartmentView();
if(state.page==='requests')html=head('A little help.','Follow every request, from start to finish.')+`<button class="primary" data-service="maintenance">+ New request</button><div class="card" style="margin-top:20px">${requestList(false)}</div>`;
if(state.page==='management')html=crmView();
if(state.page==='settings')html=`<div class="page-header"><div class="eyebrow">Made for you</div><h1>Your preferences.</h1><p>Make MyMirror feel like home.</p></div><div class="card"><div class="setting"><div><h2>Appearance</h2><p>A calm blue, day or night.</p></div><button class="secondary" id="theme-setting">${document.body.classList.contains('light')?'Dark mode':'Light mode'}</button></div><div class="setting"><div><h2>Your residence</h2><p>${safe(unitName(u()))} · Assigned residence</p></div><span class="status">My apartment</span></div><div class="setting"><div><h2>Account connection</h2><p>Owner sign-in is not connected yet.</p></div><button class="secondary" id="signin">Sign in</button></div><div class="setting"><div><h2>Your local work</h2><p>Export records and requests for safekeeping.</p></div><button class="secondary" id="export">Export</button></div></div>`;
c.innerHTML=html}
function registry(){const q=state.query.toLowerCase();let units=state.units.filter(x=>`${unitName(x)} ${x.owner}`.toLowerCase().includes(q));return units.length?units.map(x=>`<button class="unit" data-unit="${x.id}"><b>${safe(unitName(x))}</b><small>Apartment number: ${safe(x.label)}</small></button>`).join(''):empty('No matching residences','Try another room number.')}
function requestList(admin){let rows=state.requests.filter(r=>admin||r.unit===state.residentUnit);return rows.length?rows.slice().reverse().map(r=>`<div class="request"><div style="display:flex;justify-content:space-between;gap:15px"><b>${safe(r.category)} · ${safe(unitName(state.units[r.unit]))}</b><span class="status">${safe(r.status)}</span></div><p>${safe(r.detail)}</p><small>${safe(r.id)} · ${new Date(r.date).toLocaleString()} · Saved locally</small>${admin?`<label>Update status<select data-status="${safe(r.id)}" style="margin-left:12px">${['Open','In progress','Completed'].map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></label>`:''}</div>`).join(''):empty('All quiet for now.',admin?'Local requests from all residences will appear here.':'Your requests for this residence will appear here.','requests')}
function service(name){if(name==='key'||name==='garage'){modal(`<div class="sculpt" style="width:55px;height:55px">${icon(name)}</div><h2>${name==='key'?'Your phone key':'Garage access'}</h2><p>${safe(unitName(u()))}</p><span class="status">Not connected</span><p>${name==='key'?'A compatible smart lock and verified owner access must be connected before a digital key can be issued.':'The building’s gate controller must be connected before remote opening is available.'}</p><button class="secondary" data-close style="margin-top:15px;width:100%">Got it</button>`);return}let s=services.find(x=>x[0]===name);modal(`<div class="sculpt">${icon(name)}</div><h2>${s[1]}</h2><p>${safe(unitName(u()))} · Describe what you need.</p><form id="request-form"><label for="request-detail">Your request</label><textarea id="request-detail" name="detail" required maxlength="2000" placeholder="How can we help?" autofocus></textarea><label for="priority">Priority</label><select id="priority" name="priority"><option>Normal</option><option>Urgent</option></select><p style="font-size:11px">This request is saved in this browser’s workspace. It is not sent to staff until a server connection is configured. For an emergency, contact reception directly.</p><div class="modal-actions"><button type="button" class="secondary" data-close>Cancel</button><button type="submit" class="primary">Save request</button></div></form>`);document.getElementById('request-form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),detail=String(f.get('detail')).trim();if(!detail)return;state.requests.push({id:'LR-'+Date.now().toString(36).toUpperCase(),unit:state.residentUnit,category:s[1],detail,priority:f.get('priority'),status:'Open',date:new Date().toISOString()});persist();document.getElementById('sheet').close();state.page='requests';render();toast(storageOK?'Request saved locally. View it in Management.':'Request held in memory. Export before closing.')}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){state.page=b.dataset.page;render();window.scrollTo({top:0,behavior:'smooth'})}if(b.dataset.tab){state.tab=b.dataset.tab;render()}if(b.dataset.mtab){state.mtab=b.dataset.mtab;render()}if(b.dataset.service)service(b.dataset.service);if(b.hasAttribute('data-close')||b.classList.contains('close'))document.getElementById('sheet').close();if(b.id==='theme'||b.id==='theme-setting'){document.body.classList.toggle('light');persist();render()}if(b.id==='notifications'){modal(`<h2>Your updates</h2>${empty('You’re all caught up','Building announcements will appear when management messaging is connected.','bell')}`)}if(b.dataset.unit!==undefined){let x=state.units[Number(b.dataset.unit)];modal(`<h2>${safe(unitName(x))}</h2><p>Assign the actual room number to this apartment record.</p><form id="unit-form"><label for="room">Room number</label><input id="room" name="room" maxlength="40" value="${safe(x.label)}" required placeholder="Enter the actual room number"><div class="modal-actions"><button class="secondary" type="button" data-close>Cancel</button><button class="primary" type="submit">Save residence</button></div></form>`);document.getElementById('unit-form').onsubmit=e=>{e.preventDefault();let label=new FormData(e.target).get('room').trim();if(!label)return;if(state.units.some(v=>v.id!==x.id&&v.label.toLowerCase()===label.toLowerCase())){toast('That room number is already assigned.');return}x.label=label;persist();document.getElementById('sheet').close();render();toast('Room number assigned.')}}if(b.id==='export'){let blob=new Blob([JSON.stringify({format:'mymirror-workspace-v1',exportedAt:new Date().toISOString(),units:state.units,requests:state.requests,bookings:state.bookings},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='MyMirror-workspace.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}if(b.id==='signin'){modal(`<h2>Owner sign-in</h2><p>Account services are not connected yet. No credentials are submitted or saved.</p><label for="account-code">Apartment code</label><input id="account-code" autocomplete="username"><label for="password">Password</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password"><button id="eye" aria-label="Show password" aria-pressed="false">${icon('eye')}</button></div><p style="font-size:11px">Your management team will activate your account once the secure server is connected.</p><button class="primary" disabled style="width:100%;margin-top:15px">Sign-in unavailable</button>`)}if(b.id==='eye'){let p=document.getElementById('password'),shown=p.type==='password';p.type=shown?'text':'password';b.setAttribute('aria-label',shown?'Hide password':'Show password');b.setAttribute('aria-pressed',String(shown))}});
document.addEventListener('change',e=>{if(e.target.id==='unit-select'){state.unit=Number(e.target.value);persist();render()}if(e.target.dataset.status){let r=state.requests.find(x=>x.id===e.target.dataset.status);if(r){r.status=e.target.value;persist();toast('Status updated locally.')}}});document.addEventListener('input',e=>{if(e.target.id==='search'){state.query=e.target.value;if(document.getElementById('registry'))document.getElementById('registry').innerHTML=registry();else{state.mtab='registry';render()}}});document.getElementById('sheet').addEventListener('close',()=>document.getElementById('sheet-content').innerHTML='');
const defaultPhoto='https://agamlife.com/_next/image?url=%2Fproperty%2Fliving-a.webp&w=640&q=75';
const money=n=>n==null?'—':new Intl.NumberFormat('en-IL',{style:'currency',currency:'ILS',maximumFractionDigits:0}).format(n);
function records(){return state.bookings.filter(b=>b.unit===state.residentUnit)}
function financial(){return u().reports?.[state.month]||{}}
function monthPicker(){return `<div class="month-control"><label for="report-month" style="margin:0">Reporting month</label><input type="month" id="report-month" value="${safe(state.month)}"></div>`}
function quickbar(){return `<div class="quickbar">${state.shortcuts.map(k=>{let s=services.find(x=>x[0]===k);return s?`<button class="quick" data-service="${k}"><span class="sculpt">${icon(k)}</span><span>${s[1]}</span></button>`:''}).join('')}<button class="quick-edit" id="edit-shortcuts" aria-label="Customize shortcuts">+</button></div>`}
function homeFinances(){let f=financial();return `<div class="subhead"><h2>Your apartment, at a glance</h2><button class="text-button" data-page="apartment">View details ↗</button></div><div class="income-strip"><div class="card"><span class="eyebrow">Rental income</span><div class="metric">${money(f.income)}</div><span class="subtle">${safe(state.month)} · ${f.income==null?'Not connected':'Management entry'}</span></div><div class="card"><span class="eyebrow">Owner balance</span><div class="metric">${money(f.income==null?null:f.income-(f.expenses||0)-(f.fees||0))}</div><span class="subtle">After recorded expenses & fees</span></div></div>`}
function apartmentView(){let f=financial(),tab=state.tab;let out=head(safe(unitName(u())),'Your income, stays and apartment, together.')+`<button class="text-button" id="rename-home">Rename my apartment ✎</button><div class="tab-scroll"><div class="tabs">${['overview','bookings','schedule','gallery'].map(t=>`<button data-tab="${t}" class="${tab===t?'selected':''}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div>`;if(tab==='overview')return out+monthPicker()+`<div class="finance-grid">${[['Rental income',money(f.income)],['Expenses',money(f.expenses)],['Owner balance',money(f.income==null?null:f.income-(f.expenses||0)-(f.fees||0))],['Occupancy',f.nights==null?'—':Math.round(f.nights/new Date(Number(state.month.slice(0,4)),Number(state.month.slice(5)),0).getDate()*100)+'%']].map(([t,v])=>`<div class="card"><span class="eyebrow">${t}</span><div class="metric">${v}</div></div>`).join('')}</div><div class="card finance-rows"><h2>Your monthly statement</h2>${[['Rental income',f.income],['Operating expenses',f.expenses],['Management fees',f.fees],['Owner balance',f.income==null?null:f.income-(f.expenses||0)-(f.fees||0)]].map(([t,n])=>`<div class="finance-line"><span>${t}</span><span>${money(n)}</span></div>`).join('')}<p class="subtle">${f.income==null?'No statement has been recorded for this month.':'Values entered in the local CRM workspace. Cloud synchronization pending.'}</p></div>`;if(tab==='gallery')return out+`<div class="photo-grid"><button data-photo><img src="${safe(u().photo||u().stockPhoto||defaultPhoto)}" alt="${u().photo?'Apartment image':'Lake Residence waterfront image'}"><span>${u().photo?'Your apartment':'Lake Residence · Existing website image'}</span></button></div><p class="subtle">Management can add the photo for your apartment from the CRM.</p>`;if(tab==='schedule')return out+monthPicker()+calendar()+`<div class="card" style="margin-top:20px"><h2>Scheduled stays</h2>${bookingList()}</div>`;return out+`<div class="card"><h2>Your bookings</h2>${bookingList()}</div>`}
function bookingList(){let rr=records().slice().sort((a,b)=>a.arrival.localeCompare(b.arrival));return rr.length?rr.map(b=>`<div class="booking-row"><div><b>${safe(b.arrival)} → ${safe(b.departure)}</b><small>${safe(b.guests)} guests · ${safe(b.reference||'Booking')}</small></div><div>${money(b.amount)}<small>${safe(b.status||'Confirmed')}</small></div></div>`).join(''):empty('No reservations recorded','Your arrivals, departures and booking amounts will appear here.','calendar')}
function calendar(){let [year,month]=state.month.split('-').map(Number),days=new Date(year,month,0).getDate(),offset=new Date(year,month-1,1).getDay(),today=new Date().toLocaleDateString('en-CA');return `<div class="card"><h2>${new Date(year,month-1,1).toLocaleDateString('en',{month:'long',year:'numeric'})}</h2><div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="cal-label">${x}</div>`).join('')}${'<span></span>'.repeat(offset)}${Array.from({length:days},(_,i)=>{let d=state.month+'-'+String(i+1).padStart(2,'0'),booked=records().some(b=>b.arrival<=d&&b.departure>d);return `<div class="cal-day ${booked?'booked':''} ${d===today?'today':''}">${i+1}${booked?'<small>Booked</small>':''}</div>`}).join('')}</div><p class="subtle">Blue = recorded stay · Unmarked dates have no recorded booking.</p></div>`}
function crmView(){let selected=state.units[state.unit],tab=state.mtab||'registry';return `<div class="crm-top"><div><div class="eyebrow">Lake Residence · CRM</div><h1>Every apartment. Connected.</h1><p>207 apartment records · Local workspace · Server connection pending</p></div><button class="secondary" id="export">Export workspace</button></div><div class="grid3">${[['Apartments',207],['Assigned numbers',state.units.filter(x=>x.label).length],['Open requests',state.requests.filter(x=>x.status!=='Completed').length]].map(([t,n])=>`<div class="card"><span class="eyebrow">${t}</span><div class="metric">${n}</div></div>`).join('')}</div><div class="filters">${selector()}<input id="search" aria-label="Search residences" placeholder="Find an apartment…" value="${safe(state.query)}"></div><div class="crm-residence"><div class="eyebrow">Selected apartment record ${String(selected.id+1).padStart(3,'0')}</div><h2 style="margin-top:12px">${safe(unitName(selected))}</h2><p class="subtle">${selected.label?'Apartment number: '+safe(selected.label):'Actual apartment number not assigned yet'}</p><div class="actions"><button class="secondary" id="edit-residence">Apartment details</button><button class="secondary" id="edit-finances">Monthly finances</button><button class="secondary" id="add-booking">Add booking</button><button class="secondary" id="open-owner">Open owner app ↗</button></div></div><div class="tabs">${[['registry','Apartments'],['requests','Requests'],['chat','Conversations']].map(([k,n])=>`<button data-mtab="${k}" class="${tab===k?'selected':''}">${n}</button>`).join('')}</div>${tab==='registry'?`<div class="registry" id="registry">${registry()}</div>`:tab==='requests'?`<div class="card">${requestList(true)}</div>`:chatPanel(true)}<p class="subtle">Apartment switching and apartment numbers belong to the CRM. Owner access will be restricted by server permissions when connected.</p>`}
function editResidence(){let x=state.units[state.unit];modal(`<h2>Apartment details</h2><p>Record ${String(x.id+1).padStart(3,'0')} · Management only</p><form id="residence-form"><label for="actual-number">Apartment number</label><input id="actual-number" name="number" value="${safe(x.label)}" maxlength="40" required><label for="display-name">Display name</label><input id="display-name" name="nickname" value="${safe(x.nickname||'')}" maxlength="60" placeholder="e.g. Our lake home"><label for="property-photo">Apartment photo</label><input class="photo-upload" id="property-photo" type="file" accept="image/jpeg,image/png,image/webp"><p class="subtle">Choose an approved apartment or property image. Saved in this browser.</p><div class="modal-actions"><button type="button" class="secondary" data-close>Cancel</button><button class="primary">Save details</button></div></form>`);let photo=x.photo;document.getElementById('property-photo').onchange=e=>{let file=e.target.files[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>8*1024*1024){toast('Choose a JPEG, PNG or WebP smaller than 8 MB.');return}let fr=new FileReader();fr.onload=()=>{let img=new Image();img.onload=()=>{let canvas=document.createElement('canvas'),scale=Math.min(1,1200/img.width);canvas.width=img.width*scale;canvas.height=img.height*scale;canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);photo=canvas.toDataURL('image/jpeg',.8);toast('Photo ready. Save details to apply.');};img.src=fr.result};fr.readAsDataURL(file)};document.getElementById('residence-form').onsubmit=e=>{e.preventDefault();let data=new FormData(e.target),number=data.get('number').trim();if(!number)return;if(state.units.some(v=>v.id!==x.id&&v.label.toLowerCase()===number.toLowerCase()))return toast('This apartment number is already assigned.');x.label=number;x.nickname=data.get('nickname').trim();if(photo)x.photo=photo;persist();document.getElementById('sheet').close();render();toast('Apartment details saved locally.')};}
function renameHome(){modal(`<h2>Make it yours.</h2><p>Choose a name for your apartment. Its apartment number stays unchanged.</p><form id="nickname-form"><label for="nickname">Apartment display name</label><input id="nickname" name="nickname" value="${safe(u().nickname||'')}" maxlength="60" placeholder="Our lake home"><p class="subtle">Apartment number: ${safe(u().label||'Awaiting management assignment')}</p><div class="modal-actions"><button type="button" class="secondary" data-close>Cancel</button><button class="primary">Save name</button></div></form>`);document.getElementById('nickname-form').onsubmit=e=>{e.preventDefault();u().nickname=new FormData(e.target).get('nickname').trim();persist();document.getElementById('sheet').close();render();toast('Apartment name updated.')};}
function editFinances(){let x=state.units[state.unit],f=x.reports?.[state.month]||{};modal(`<h2>Monthly statement</h2><p>${safe(unitName(x))} · Management entry</p><form id="finance-form"><label for="finance-month">Month</label><input id="finance-month" type="month" name="month" value="${safe(state.month)}" required>${[['income','Rental income'],['expenses','Operating expenses'],['fees','Management fees'],['nights','Booked nights']].map(([k,n])=>`<label for="f-${k}">${n}${k!=='nights'?' (₪)':''}</label><input id="f-${k}" name="${k}" type="number" min="0" ${k==='nights'?'max="31" step="1"':'step="0.01"'} value="${f[k]??''}" required>`).join('')}<div class="modal-actions"><button type="button" class="secondary" data-close>Cancel</button><button class="primary">Save statement</button></div></form>`);document.getElementById('finance-form').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target),m=d.get('month'),max=new Date(+m.slice(0,4),+m.slice(5),0).getDate();if(+d.get('nights')>max)return toast('Booked nights exceed the days in this month.');x.reports=x.reports||{};x.reports[m]=Object.fromEntries(['income','expenses','fees','nights'].map(k=>[k,Number(d.get(k))]));state.month=m;persist();document.getElementById('sheet').close();render();toast('Monthly statement saved locally.')};}
function addBooking(){let x=state.units[state.unit];modal(`<h2>Add a booking</h2><p>${safe(unitName(x))} · Management entry</p><form id="booking-form"><label for="arrival">Arrival</label><input id="arrival" name="arrival" type="date" required><label for="departure">Departure</label><input id="departure" name="departure" type="date" required><label for="guests">Guests</label><input id="guests" name="guests" type="number" min="1" max="30" required><label for="amount">Booking amount (₪)</label><input id="amount" name="amount" type="number" min="0" step="0.01" required><label for="reference">Booking reference</label><input id="reference" name="reference" maxlength="80"><div class="modal-actions"><button type="button" class="secondary" data-close>Cancel</button><button class="primary">Save booking</button></div></form>`);document.getElementById('booking-form').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target);if(d.get('departure')<=d.get('arrival'))return toast('Departure must be after arrival.');if(state.bookings.some(b=>b.unit===state.unit&&b.arrival<d.get('departure')&&b.departure>d.get('arrival')))return toast('These dates overlap an existing booking.');state.bookings.push({unit:state.unit,arrival:d.get('arrival'),departure:d.get('departure'),guests:+d.get('guests'),amount:+d.get('amount'),reference:d.get('reference'),status:'Confirmed'});persist();document.getElementById('sheet').close();render();toast('Booking saved locally.')};}
state.messages=Array.isArray(saved.messages)?saved.messages:[];
const originalPersist=persist;
function saveMessages(){try{let data=JSON.parse(localStorage.getItem('mymirror-next-v1')||'{}');data.messages=state.messages;localStorage.setItem('mymirror-next-v1',JSON.stringify(data))}catch{toast('Message held in memory. Browser storage unavailable.')}}
function chatPanel(admin){let unit=admin?state.unit:state.residentUnit,items=state.messages.filter(x=>x.unit===unit);return `<div class="card"><h2>${admin?'Apartment conversation':'Talk to Lake Residence'}</h2><p class="subtle">${safe(unitName(state.units[unit]))} · Local conversation only, not delivered to staff.</p><div class="chat-log">${items.length?items.map(m=>`<div class="bubble ${m.sender==='Management'?'staff':''}"><b>${safe(m.sender)}</b><p>${safe(m.text)}</p><small>${new Date(m.date).toLocaleString()}</small></div>`).join(''):empty('Start a conversation','Messages will be stored on this browser until the server connection is configured.','concierge')}</div><form id="chat-form"><label for="chat-text">Message</label><textarea id="chat-text" maxlength="2000" required placeholder="Write a message…"></textarea><button class="primary" style="margin-top:12px">Save message locally</button></form></div>`}
function bindChat(){let form=document.getElementById('chat-form');if(form)form.onsubmit=e=>{e.preventDefault();let text=document.getElementById('chat-text').value.trim();if(!text)return;state.messages.push({unit:state.page==='management'?state.unit:state.residentUnit,sender:state.page==='management'?'Management':'Owner',text,date:new Date().toISOString()});saveMessages();render();};}
const baseRender=render;render=function(){if(!state.crm&&state.page==='management')state.page='home';baseRender();if(state.page!=='management'){document.querySelector('.crm-link')?.remove();let settings=document.querySelector('#content .card');if(state.page==='settings'&&settings)settings.insertAdjacentHTML('afterbegin',`<div class="setting"><div><h2>${safe(unitName(u()))}</h2><p>Apartment number ${safe(u().label||'not yet assigned')} · Number managed by CRM</p></div><button class="secondary" id="rename-home">Rename</button></div><div class="setting"><div><h2>Install MyMirror</h2><p>Keep your apartment on your home screen.</p></div><button class="secondary" id="install-app">Install</button></div>`)}else{document.getElementById('navigation').innerHTML=`<button class="nav active" data-page="management">${icon('management')}<span>CRM workspace</span></button>`;document.querySelector('.mobile-brand').textContent='≈ Lake Residence CRM';document.querySelector('.brand .word').textContent='Residence CRM';}if(state.page==='chat')document.getElementById('content').innerHTML=head('Let’s talk.','Your conversation with Lake Residence.')+chatPanel(false);bindChat();};
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.id==='rename-home')renameHome();if(b.id==='edit-residence')editResidence();if(b.id==='edit-finances')editFinances();if(b.id==='add-booking')addBooking();if(b.id==='open-owner'){state.residentUnit=state.unit;persist();saveMessages();let a=document.createElement('a');a.href='MyMirror.html';a.target='_blank';a.rel='noopener';a.click();}if(b.dataset.unit!==undefined){document.getElementById('sheet').close();state.unit=Number(b.dataset.unit);state.query='';render();}if(b.hasAttribute('data-calendar')){state.page='apartment';state.tab='schedule';render();}if(b.hasAttribute('data-photo'))modal(`<img class="photo-full" src="${safe(u().photo||u().stockPhoto||defaultPhoto)}" alt="Apartment or property image"><p>${safe(unitName(u()))}</p>`);if(b.id==='edit-shortcuts'){modal(`<h2>Your shortcuts.</h2><p>Choose up to five controls for the row beneath your apartment photo.</p><form id="shortcut-form"><div class="chip-list">${services.map(s=>`<label class="shortcut-choice"><input type="checkbox" name="shortcut" value="${s[0]}" ${state.shortcuts.includes(s[0])?'checked':''}>${icon(s[0])}${s[1]}</label>`).join('')}</div><button class="primary" style="width:100%;margin-top:20px">Save shortcuts</button></form>`);document.getElementById('shortcut-form').onsubmit=e=>{e.preventDefault();let values=new FormData(e.target).getAll('shortcut');if(!values.length||values.length>5)return toast('Choose between one and five shortcuts.');state.shortcuts=values;persist();saveMessages();document.getElementById('sheet').close();render();};}if(b.id==='install-app')installApp();});

const trades=['Operations','Housekeeping','Public area cleaning','Laundry & linen','Maintenance','Electrician','Plumber','Air conditioning','Pool','Gardening','Security','Reception','Concierge','Reservations','Room service','Kitchen','Market'];
function suggestTrade(text){let rules=[['Electrician',/electri|socket|power|חשמל|שקע|קצר/i],['Plumber',/leak|sink|plumb|water pipe|נזיל|כיור|אינסטל|סתימ/i],['Air conditioning',/air.?condition|\bac\b|מזגן|מיזוג/i],['Laundry & linen',/towel|linen|laundry|מגבת|מגבות|מצעים|כביסה/i],['Public area cleaning',/corridor|lobby|מסדרון|לובי/i],['Housekeeping',/clean|housekeep|ניקוי|ניקיון|לנקות/i],['Pool',/pool|בריכה/i],['Gardening',/garden|גינון|צמח/i],['Security',/secur|gate|ביטחון|אבטחה|שער/i],['Reception',/reception|check.?in|קבלה|כניסה/i],['Reservations',/reserv|booking|extend|הזמנ|הארכ/i],['Room service',/room service|breakfast|meal|שירות חדרים|ארוח/i],['Market',/market|grocery|מרקט|קניות/i],['Concierge',/concierge|taxi|קונסייר|מונית/i]];return rules.find(([,re])=>re.test(text))?.[0]||'Operations';}
function commandCenter(){return `<div class="command-panel card"><div class="eyebrow">Control Team · Manager’s assistant</div><h2 style="margin-top:14px">Say it. Review it. Keep it moving.</h2><p class="subtle">Write or dictate an instruction. Review the suggested trade before saving tasks. Nothing is delivered to workers from this local workspace.</p><textarea id="command-text" dir="auto" placeholder="e.g. Check the leak in apartment 405; bring towels to apartment 25." maxlength="6000"></textarea><div class="command-actions"><button class="secondary" id="dictate">${icon('mic')} Dictate</button><select id="voice-lang" aria-label="Dictation language"><option value="he-IL">עברית</option><option value="en-US">English</option></select><button class="primary" id="prepare-tasks">Review suggested tasks ↗</button></div><p class="subtle" id="voice-note">Trade suggestions use keywords. AI interpretation and worker delivery are not connected.</p></div>`}
function taskBoard(){let list=state.tasks.filter(t=>!state.tradeFilter||t.trade===state.tradeFilter);return `<div class="filters"><select id="trade-filter" aria-label="Filter by trade"><option value="">All trades</option>${trades.map(t=>`<option ${state.tradeFilter===t?'selected':''}>${t}</option>`).join('')}</select></div>${list.length?list.slice().reverse().map(t=>`<div class="card task-card"><div class="crm-top"><span class="status">${safe(t.trade)}</span><span class="subtle">${safe(t.apartment||'Location to confirm')}</span></div><h2 style="margin-top:16px;font-size:17px" dir="auto">${safe(t.text)}</h2><p class="subtle">Personal assignee: not assigned · Not delivered to a worker</p><label>Status<select data-task-status="${safe(t.id)}">${['Awaiting assignment','Received','In progress','Missing equipment','Completed'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></label></div>`).join(''):empty('No tasks recorded','Use the manager’s assistant to prepare tasks by trade.','requests')}`}
function prepareTasks(){let text=document.getElementById('command-text').value.trim();if(!text)return toast('Write or dictate an instruction first.');let parts=text.split(/[;\n]+|[.!?]\s+/).map(x=>x.trim()).filter(Boolean);modal(`<h2>Review tasks</h2><p>Confirm the trade and location. Saving adds tasks locally; it does not send them to workers.</p><form id="task-preview">${parts.map((s,i)=>`<div class="task-draft"><label for="task-${i}">Task ${i+1}</label><textarea id="task-${i}" name="text-${i}" dir="auto" required maxlength="2000">${safe(s)}</textarea><label for="task-trade-${i}">Suggested trade</label><select id="task-trade-${i}" name="trade-${i}">${trades.map(t=>`<option ${t===suggestTrade(s)?'selected':''}>${t}</option>`).join('')}</select><label for="task-location-${i}">Apartment / location</label><input id="task-location-${i}" name="location-${i}" value="${safe(s.match(/(?:apartment|room|דירה|חדר)\s*(\d+)/i)?.[1]||'')}" placeholder="Confirm the location"></div>`).join('')}<button class="primary" style="width:100%;margin-top:20px">Save ${parts.length} task${parts.length===1?'':'s'} locally</button></form>`);document.getElementById('task-preview').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target);parts.forEach((s,i)=>state.tasks.push({id:'TASK-'+Date.now().toString(36)+'-'+i,text:d.get('text-'+i).trim(),trade:d.get('trade-'+i),apartment:d.get('location-'+i).trim(),status:'Awaiting assignment',date:new Date().toISOString()}));persist();document.getElementById('sheet').close();state.mtab='tasks';render();toast('Tasks saved locally. No worker notifications sent.');};}
const originalCrmView=crmView;crmView=function(){let tab=state.mtab||'command';let out=originalCrmView();let tabsStart=out.indexOf('<div class="tabs">'),tail=out.lastIndexOf('<p class="subtle">Apartment switching');return out.slice(0,tabsStart)+`<div class="tabs">${[['command','Command center'],['tasks','Trade tasks'],['registry','207 apartments'],['requests','Owner requests'],['chat','Conversations']].map(([k,n])=>`<button data-mtab="${k}" class="${tab===k?'selected':''}">${n}</button>`).join('')}</div>`+(tab==='command'?commandCenter():tab==='tasks'?taskBoard():tab==='registry'?`<div class="registry" id="registry">${registry()}</div>`:tab==='requests'?`<div class="card">${requestList(true)}</div>`:chatPanel(true))+out.slice(tail);};
let recognition=null;function dictate(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Dictation is unavailable here. Use your phone keyboard microphone or type.');if(recognition){recognition.stop();return;}recognition=new SR();recognition.lang=document.getElementById('voice-lang').value;recognition.interimResults=false;recognition.continuous=true;recognition.onresult=e=>{let box=document.getElementById('command-text');if(!box)return;for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)box.value+=(box.value?'\n':'')+e.results[i][0].transcript;};recognition.onend=()=>{recognition=null;let b=document.getElementById('dictate');if(b)b.innerHTML=icon('mic')+' Dictate';};recognition.onerror=e=>{toast(e.error==='not-allowed'?'Microphone permission was not granted. You can still type.':'Dictation stopped. Please try again or type.');recognition?.stop();};try{recognition.start();document.getElementById('dictate').textContent='Stop dictation';document.getElementById('voice-note').textContent='Listening. Your browser may process speech using its speech service. Review the text before saving tasks.';}catch{recognition=null;toast('Could not start dictation. You can still type.');}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.id==='prepare-tasks')prepareTasks();if(b.id==='dictate')dictate();});document.addEventListener('change',e=>{if(e.target.id==='trade-filter'){state.tradeFilter=e.target.value;render();}if(e.target.dataset.taskStatus){let t=state.tasks.find(t=>t.id===e.target.dataset.taskStatus);if(t){t.status=e.target.value;persist();toast('Task status saved locally.');}}});

function teamDashboard(){return '<div class="subhead"><h2>Today, at a glance</h2><button class="primary" id="add-employee">+ Add employee</button></div><div class="grid3">'+[['Today’s tasks',state.tasks.filter(t=>t.date.slice(0,10)===new Date().toISOString().slice(0,10)).length],['Active employees',state.workers.length],['Completed tasks',state.tasks.filter(t=>t.status==='Completed').length]].map(([t,n])=>'<div class="card"><span class="eyebrow">'+t+'</span><div class="metric">'+n+'</div></div>').join('')+'</div><div class="subhead"><h2>Work groups</h2></div><div class="trade-grid">'+trades.map(t=>{let staff=state.workers.filter(w=>w.trade===t).length,open=state.tasks.filter(x=>x.trade===t&&x.status!=='Completed').length,done=state.tasks.filter(x=>x.trade===t&&x.status==='Completed').length;return '<button class="trade-card" data-trade="'+safe(t)+'"><span class="sculpt">'+icon(t==='Housekeeping'?'clean':t==='Room service'?'food':t==='Concierge'?'concierge':'maintenance')+'</span><b>'+t+'</b><small>'+staff+' employees · '+open+' open tasks</small><span class="done-label">'+done+' completed</span></button>'}).join('')+'</div><div class="subhead"><h2>Apartment overview · 207</h2><button class="text-button" data-mtab="registry">View all records ↗</button></div><div class="rooms-mini">'+state.units.map(x=>'<button data-unit="'+x.id+'" class="mini-room" aria-label="Open '+safe(unitName(x))+'">'+icon('apartment')+'<span>'+safe(x.label||String(x.id+1).padStart(3,'0'))+'</span></button>').join('')+'</div><p class="subtle">Unassigned tiles show internal record IDs until the actual room numbers are entered.</p>';}
const commandView=crmView;crmView=function(){let out=commandView();let start=out.indexOf('<div class="tabs">'),tail=out.lastIndexOf('<p class="subtle">Apartment switching'),tab=state.mtab||'dashboard';let body=tab==='dashboard'?teamDashboard():tab==='employees'?employeeView():null;if(body!==null)return out.slice(0,start)+'<div class="tabs">'+[['dashboard','Overview'],['command','Voice / chat'],['tasks','Daily tasks'],['employees','Employees'],['registry','Apartments'],['chat','Messages']].map(([k,n])=>'<button data-mtab="'+k+'" class="'+(tab===k?'selected':'')+'">'+n+'</button>').join('')+'</div>'+body+out.slice(tail);return out.slice(0,start)+'<div class="tabs"><button data-mtab="dashboard">Overview</button><button data-mtab="employees">Employees</button></div>'+out.slice(start);};
function employeeView(){let w=state.workers.find(w=>w.id===state.workerView),list=w?state.tasks.filter(t=>t.worker===w.id):[];return '<div class="subhead"><h2>Employee task view</h2><button class="primary" id="add-employee">+ Add employee</button></div><select id="worker-view" aria-label="Employee"><option value="">Choose an employee</option>'+state.workers.map(x=>'<option value="'+x.id+'" '+(w?.id===x.id?'selected':'')+'>'+safe(x.name)+' · '+safe(x.trade)+'</option>').join('')+'</select>'+(w?'<p class="subtle">'+safe(w.trade)+' · '+list.length+' assigned tasks · Local manager view, not an authenticated employee account.</p>'+list.map(t=>'<div class="card task-card '+(t.status==='Completed'?'done-task':'')+'"><span class="status">'+safe(t.status)+'</span><h2 style="margin-top:15px;font-size:17px" dir="auto">'+safe(t.text)+'</h2><p class="subtle">'+safe(t.apartment||'Location to confirm')+'</p><select aria-label="Task status" data-task-status="'+t.id+'">'+['Awaiting assignment','Received','In progress','Missing equipment','Completed'].map(s=>'<option '+(s===t.status?'selected':'')+'>'+s+'</option>').join('')+'</select></div>').join('')+(list.length?'':empty('No tasks assigned','Assign a task to this employee from Daily tasks.','requests')):empty('Select an employee','Add real employees and their trades, then assign their tasks.','settings'));}
const unassignedTaskBoard=taskBoard;taskBoard=function(){let html=unassignedTaskBoard();state.tasks.forEach(t=>{let marker='<label>Status<select data-task-status="'+safe(t.id)+'">';let w=state.workers.find(w=>w.id===t.worker);let field='<label>Assign to employee<select aria-label="Assign employee" data-task-worker="'+safe(t.id)+'"><option value="">Unassigned</option>'+state.workers.filter(w=>w.trade===t.trade).map(w=>'<option value="'+w.id+'" '+(w.id===t.worker?'selected':'')+'>'+safe(w.name)+'</option>').join('')+'</select></label>';html=html.replace(marker,field+marker);if(t.status==='Completed')html=html.replace('<span class="status">'+safe(t.trade)+'</span>','<span class="status done-status">'+safe(t.trade)+' · Completed</span>');if(w)html=html.replace('Personal assignee: not assigned · Not delivered to a worker','Assigned locally: '+safe(w.name)+' · Delivery not connected');});return html;};

const simplifiedHomeRender=render;render=function(){simplifiedHomeRender();if(!state.crm){document.getElementById('owner-profile-photo')?.remove();document.getElementById('my-apartments')?.remove();if(state.page==='home'){let side=document.querySelector('.side-column'),sub=side?.querySelector('.subhead');if(sub){let parent=sub.parentElement;if(parent&&parent!==side)parent.remove();}let upcoming=side?.querySelector('.upcoming-card'),welcome=side?.querySelector('.welcome');if(upcoming&&welcome){welcome.classList.add('compact-next-stay');upcoming.appendChild(welcome);}let number=document.querySelector('.property-number');if(number){number.innerHTML='<label class="apartment-inline-label" for="owned-apartment-select">Apartment number</label><select id="owned-apartment-select" class="owned-apartment-select" aria-label="Choose apartment">'+state.ownerUnits.map(id=>'<option value="'+id+'" '+(id===state.residentUnit?'selected':'')+'> '+safe(state.units[id].label)+'</option>').join('')+'</select>';}let cover=document.getElementById('change-cover'),hero=document.querySelector('.hero');if(cover&&hero){hero.appendChild(cover);cover.classList.add('opposite-cover-edit');}}}localize();};document.addEventListener('change',e=>{if(e.target.id==='owned-apartment-select'){let id=Number(e.target.value);if(!state.ownerUnits.includes(id))return;state.residentUnit=id;persist();render();}});


const apartmentImages=['https://agamlife.com/_next/image?url=%2Fproperty%2Fliving-a.webp&w=640&q=75','https://agamlife.com/_next/image?url=%2Fproperty%2Finterior-1.webp&w=640&q=75','https://agamlife.com/_next/image?url=%2Fproperty%2Finterior-2.webp&w=640&q=75'];
apartmentImages.forEach((src,id)=>{if(state.units[id])state.units[id].stockPhoto=src;});
function exampleFactor(){return [1,14630/18480,25410/18480][state.residentUnit]||1;}
const singleApartmentFinancial=financial;financial=function(){let f=singleApartmentFinancial();if(!state.show2027Example)return f;let factor=exampleFactor();return {...f,income:Math.round(f.income*factor),expenses:[4466,3490,5260][state.residentUnit]||f.expenses,fees:Math.round(f.fees*factor),nights:Math.min(new Date(+state.month.slice(0,4),+state.month.slice(5),0).getDate(),Math.round(f.nights*[1,19/24,27/24][state.residentUnit]||f.nights))};};


const compactPickerRender=render;render=function(){compactPickerRender();if(!state.crm&&state.page==='home'){let wrap=document.querySelector('.property-number'),select=document.getElementById('owned-apartment-select');if(wrap&&select){let label=wrap.querySelector('label');if(label)label.remove();select.setAttribute('aria-label','Choose apartment');select.classList.add('compact-apartment-picker');select.innerHTML=state.ownerUnits.map(id=>'<option value="'+id+'" '+(id===state.residentUnit?'selected':'')+'>'+(language==='he'?'דירה מספר ':'Apartment No. ')+safe(state.units[id].label)+'</option>').join('');}let img=document.querySelector('.residence-photo');if(img){img.alt=language==='he'?'התמונה הראשית של דירה '+u().label:'Main image for apartment '+u().label;img.style.objectPosition='center';}}};

function ft(a,b){return language==='he'?b:a;}
function financeRows(rows){return '<div class="finance-ledger">'+rows.map(r=>'<div class="booking-row"><div><b>'+safe(r[0])+'</b><small>'+safe(r[1]||'')+'</small></div><strong>'+safe(r[2])+'</strong></div>').join('')+'</div>';}
function financeDetail(kind,offset=0){
 let f=financial(),sample=state.show2027Example,month=state.month,days=new Date(+month.slice(0,4),+month.slice(5),0).getDate(),title={income:ft('Rental income','הכנסות משכירות'),balance:ft('Owner balance','יתרת בעלים'),occupancy:ft('Occupancy','תפוסה')}[kind];
 let body='<p class="subtle">'+ft('Apartment No. ','דירה מספר ')+safe(u().label)+' · '+safe(month)+'</p><div class="example-banner">'+(sample?ft('2027 illustration only. Sample figures, not actual transactions.','המחשה לשנת 2027 בלבד. נתוני דוגמה, לא תנועות כספיות אמיתיות.'):ft('Local CRM records. Missing records do not mean zero activity.','רישומי CRM מקומיים. היעדר רישום אינו מעיד על היעדר פעילות.'))+'</div>';
 if(kind==='income'){
 let a=Math.round(f.income*.4),b=Math.round(f.income*.35);
 let rows=sample?[[ft('Direct booking · EX-01','הזמנה ישירה · EX-01'),month+'-03 → '+month+'-10',money(a)],[ft('Website booking · EX-02','הזמנה מהאתר · EX-02'),month+'-12 → '+month+'-19',money(b)],[ft('Partner booking · EX-03','הזמנת שותף · EX-03'),month+'-22 → '+month+'-'+days,money(f.income-a-b)]]:records().filter(b=>b.arrival?.startsWith(month)).map(b=>[b.reference||ft('Booking','הזמנה'),b.arrival+' → '+b.departure,money(b.amount)]);
 body+='<div class="metric">'+money(f.income||0)+'</div>'+financeRows(rows)+(rows.length?'':'<p>'+ft('No itemized bookings recorded.','טרם נרשם פירוט הזמנות.')+'</p>')+'<p class="subtle">'+ft('Booking amounts and the monthly statement may differ until payments and adjustments are reconciled.','סכומי הזמנות והדוח החודשי עשויים להיות שונים עד להתאמת תשלומים וזיכויים.')+'</p>';
 }else if(kind==='balance'){
 body+='<div class="metric">'+money((f.income||0)-(f.expenses||0)-(f.fees||0))+'</div>'+financeRows([[ft('Rental income','הכנסות משכירות'),month,money(f.income||0)],[ft('Operating expenses','הוצאות תפעול'),ft('Housekeeping, maintenance and supplies','משק בית, תחזוקה וציוד'),'−'+money(f.expenses||0)],[ft('Management fees','דמי ניהול'),month,'−'+money(f.fees||0)]])+'<h3>'+ft('Withdrawals & transfers','משיכות והעברות')+'</h3><p>'+ft('No withdrawals recorded for this period. No withdrawal date is available.','לא נרשמו משיכות בתקופה זו. אין תאריך משיכה מתועד.')+'</p><p class="subtle">'+ft('Balance shown is net income before withdrawals. Bank transfers are not connected yet.','היתרה המוצגת היא הכנסה נטו לפני משיכות. העברות בנקאיות טרם חוברו.')+'</p>';
 }else{
 let base=sample?new Date(month+'-15T12:00:00'):new Date(),date=new Date(base);date.setDate(date.getDate()+offset);
 let dateKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
 let occupied=d=>sample?(((d.getDate()-1+state.residentUnit)%new Date(d.getFullYear(),d.getMonth()+1,0).getDate())<Math.min(f.nights||0,days)):records().some(b=>b.status!=='Cancelled'&&b.arrival<=dateKey(d)&&b.departure>dateKey(d));
 body+='<div class="metric">'+Math.round((f.nights||0)/days*100)+'%</div><p>'+safe(String(f.nights||0))+' / '+days+' '+ft('occupied nights','לילות תפוסים')+'</p><div class="finance-jumps">'+[[-1,ft('Yesterday','אתמול')],[0,ft('Today','היום')],[1,ft('Tomorrow','מחר')],[(5-base.getDay()+7)%7,ft('Friday','יום שישי')],[7,ft('Next week','שבוע הבא')]].map(([n,t])=>'<button class="secondary" data-occ-offset="'+n+'">'+t+'</button>').join('')+'</div><p class="subtle">'+(sample?ft('Dates are relative to the 15th of the selected illustrative month.','התאריכים יחסיים ל־15 בחודש ההמחשה הנבחר.'):'')+'</p><div class="card"><b>'+dateKey(date)+'</b><p>'+ (occupied(date)?ft('Occupied','תפוס'):(sample?ft('Available','פנוי'):ft('No booking recorded · availability unverified','לא נרשמה הזמנה · זמינות לא מאומתת')))+'</p></div><h3>'+ft('Daily occupancy','תפוסה יומית')+'</h3><div class="occupancy-days">'+Array.from({length:days},(_,i)=>{let d=new Date(month+'-'+String(i+1).padStart(2,'0')+'T12:00:00');return '<button class="occ-day '+(occupied(d)?'booked':'')+'" data-occ-offset="'+Math.round((d-base)/86400000)+'">'+(i+1)+'</button>';}).join('')+'</div><p class="subtle">'+ft('Colored = occupied. Uncolored = sample availability or no recorded booking.','צבע מודגש = תפוס. ללא הדגשה = פנוי בהמחשה או ללא הזמנה מתועדת.')+'</p><h3>'+ft('Weekly changes','שינויים שבועיים')+'</h3>'+financeRows([0,7,14,21,28].filter(n=>n<days).map(n=>{let count=0,end=Math.min(n+7,days);for(let d=n+1;d<=end;d++)if(occupied(new Date(month+'-'+String(d).padStart(2,'0')+'T12:00:00')))count++;return [(n+1)+'–'+end+' · '+month,ft('Occupied nights','לילות תפוסים'),count+'/'+(end-n)+' · '+Math.round(count/(end-n)*100)+'%'];}));
 }
 modal('<div class="finance-detail"><h2>'+title+'</h2>'+body+'<button class="primary" id="finance-close">'+ft('Close','סגירה')+'</button></div>');document.getElementById('finance-close').onclick=()=>document.getElementById('sheet').close();document.querySelectorAll('[data-occ-offset]').forEach(b=>b.onclick=()=>financeDetail('occupancy',+b.dataset.occOffset));
}
const passiveFinances=homeFinances;homeFinances=function(){let h=passiveFinances(),i=0;return h.replace(/<div class="card"><span class="eyebrow">/g,()=>'<button type="button" class="card finance-button" data-finance="'+(['income','balance','occupancy'][i++]||'income')+'"><span class="eyebrow">').replace(/<\/span><\/div>(?=<\/div>|<button type="button" class="card finance-button")/g,'</span></button>');};
document.addEventListener('click',e=>{let b=e.target.closest('[data-finance]');if(b)financeDetail(b.dataset.finance);});

const embeddedApartmentCovers=["/myapp/apartment-cover-1.webp","/myapp/apartment-cover-2.webp","/myapp/apartment-cover-3.webp"];embeddedApartmentCovers.forEach((src,i)=>state.units[i].stockPhoto=src);

const interactiveExampleFinances=homeFinances;homeFinances=function(){if(state.show2027Example)return interactiveExampleFinances();let f=financial(),days=new Date(+state.month.slice(0,4),+state.month.slice(5),0).getDate();return '<div class="example-header"><h2>Your apartment, at a glance</h2>'+exampleSwitch()+'</div><div class="income-strip">'+[['income','Rental income',money(f.income||0)],['balance','Owner balance',money((f.income||0)-(f.expenses||0)-(f.fees||0))],['occupancy','Occupancy',f.nights==null?'—':Math.round(f.nights/days*100)+'%']].map(([key,label,value])=>'<button type="button" class="card finance-button" data-finance="'+key+'"><span class="eyebrow">'+label+'</span><div class="metric">'+value+'</div><span class="subtle">'+safe(state.month)+'</span></button>').join('')+'</div>';};
